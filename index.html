<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candidature faction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14202b;
    --panel: #1c2b38;
    --line: #2f4356;
    --text: #e8eef2;
    --muted: #93a7b6;
    --accent: #4fb3a5;
    --accent-ink: #0c1a1f;
    --danger: #ef7b6c;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; padding: 32px 16px 64px;
    font: 400 16px/1.55 "Barlow", system-ui, sans-serif;
    color: var(--text); background: var(--bg);
  }
  main { max-width: 680px; margin: 0 auto; }
  h1 {
    font: 700 44px/1.05 "Barlow Condensed", "Arial Narrow", sans-serif;
    letter-spacing: .01em; margin: 0 0 8px;
  }
  .intro { color: var(--muted); margin: 0 0 32px; max-width: 52ch; }
  form { display: grid; gap: 22px; }
  fieldset { border: 0; padding: 0; margin: 0; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr; } h1 { font-size: 36px; } }
  label, legend { display: block; font-weight: 600; margin-bottom: 6px; padding: 0; }
  .hint { display: block; font-weight: 400; font-size: 14px; color: var(--muted); }
  input[type=text], select, textarea {
    width: 100%; padding: 11px 12px; font: inherit; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  }
  textarea { min-height: 120px; resize: vertical; }
  select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, .check input:focus-visible + span {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .count { text-align: right; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  @media (max-width: 560px) { .checks { grid-template-columns: 1fr; } }
  .check { position: relative; }
  .check input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
  .check span {
    display: block; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel); color: var(--muted); font-weight: 500;
  }
  .check input:checked + span { border-color: var(--accent); color: var(--text); background: #1d3a3d; }
  button {
    font: 700 20px "Barlow Condensed", sans-serif; letter-spacing: .03em;
    padding: 13px 22px; border: 0; border-radius: 6px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
  }
  button[disabled] { opacity: .6; cursor: wait; }
  .msg { padding: 12px 14px; border-radius: 6px; display: none; }
  .msg.ok { display: block; background: #1d3a3d; border: 1px solid var(--accent); }
  .msg.err { display: block; background: #3a2422; border: 1px solid var(--danger); }
  .hp { position: absolute; left: -9999px; }
</style>
</head>
<body>
<main>
  <h1>Candidature faction</h1>
  <p class="intro">Remplis chaque champ avec soin. Ton dossier est envoyé directement au staff, qui te répondra sur Discord.</p>

  <form id="form" novalidate>
    <div class="row">
      <div>
        <label for="nomJeu">Nom en jeu <span class="hint">Prénom_Nom de ton personnage</span></label>
        <input type="text" id="nomJeu" name="nomJeu" maxlength="60" required autocomplete="off">
      </div>
      <div>
        <label for="discord">Pseudo Discord <span class="hint">Pour que le staff puisse te contacter</span></label>
        <input type="text" id="discord" name="discord" maxlength="60" required autocomplete="off">
      </div>
    </div>

    <div>
      <label for="faction">Faction visée</label>
      <select id="faction" name="faction" required>
        <option value="" selected disabled>Choisir une faction</option>
        <option>Police</option>
        <option>Armée</option>
        <option>EMS</option>
        <option>FBI</option>
        <option>Mécanique</option>
      </select>
    </div>

    <div>
      <label for="experience">Expérience <span class="hint">Serveurs RP, factions déjà tenues, durée, rôle occupé</span></label>
      <textarea id="experience" name="experience" maxlength="1000" required></textarea>
      <div class="count"></div>
    </div>

    <div>
      <label for="projet">Projet de faction <span class="hint">Ce que tu veux apporter et faire évoluer dans la faction</span></label>
      <textarea id="projet" name="projet" maxlength="1000" required></textarea>
      <div class="count"></div>
    </div>

    <div>
      <label for="mes1">Mise en scène 1 <span class="hint">Décris une situation RP liée à la faction visée, avec ton personnage</span></label>
      <textarea id="mes1" name="mes1" maxlength="1000" required></textarea>
      <div class="count"></div>
    </div>

    <div>
      <label for="mes2">Mise en scène 2 <span class="hint">Une seconde situation, différente de la première</span></label>
      <textarea id="mes2" name="mes2" maxlength="1000" required></textarea>
      <div class="count"></div>
    </div>

    <fieldset>
      <legend>Disponibilités <span class="hint">Coche tout ce qui te convient</span></legend>
      <div class="checks">
        <label class="check"><input type="checkbox" name="dispo" value="Semaine – matin"><span>Semaine, matin</span></label>
        <label class="check"><input type="checkbox" name="dispo" value="Semaine – après-midi"><span>Semaine, après-midi</span></label>
        <label class="check"><input type="checkbox" name="dispo" value="Semaine – soir"><span>Semaine, soir</span></label>
        <label class="check"><input type="checkbox" name="dispo" value="Week-end – journée"><span>Week-end, journée</span></label>
        <label class="check"><input type="checkbox" name="dispo" value="Week-end – soir"><span>Week-end, soir</span></label>
        <label class="check"><input type="checkbox" name="dispo" value="Variable selon les jours"><span>Variable selon les jours</span></label>
      </div>
    </fieldset>

    <div>
      <label for="motivation">Motivation <span class="hint">Pourquoi cette faction, et pourquoi toi</span></label>
      <textarea id="motivation" name="motivation" maxlength="1000" required></textarea>
      <div class="count"></div>
    </div>

    <input class="hp" type="text" name="site" tabindex="-1" autocomplete="off" aria-hidden="true">

    <div id="msg" class="msg" role="status"></div>
    <button type="submit" id="send">Envoyer ma candidature</button>
  </form>
</main>

<script>
  // Colle ici l'URL de ton webhook Discord (Paramètres du salon > Intégrations > Webhooks).
  const WEBHOOK_URL = "https://discord.com/api/webhooks/1554268992053710870/5whZnv5E_nur8gxyizXc_aATGKQSie8Ku2Z1wTCj1YyLv_IHcInncYHWokObrWNYJYeE";

  const COLORS = { "Police": 0x3b82f6, "Armée": 0x6b8e23, "EMS": 0xef4444, "FBI": 0x1e293b, "Mécanique": 0xf59e0b };
  const form = document.getElementById("form");
  const msg = document.getElementById("msg");
  const btn = document.getElementById("send");

  document.querySelectorAll("textarea").forEach(t => {
    const c = t.parentElement.querySelector(".count");
    const upd = () => c.textContent = t.value.length + " / " + t.maxLength;
    t.addEventListener("input", upd); upd();
  });

  function show(type, text) { msg.className = "msg " + type; msg.textContent = text; }
  const val = id => document.getElementById(id).value.trim();
  const cut = (s, n) => s.length > n ? s.slice(0, n - 1) + "…" : s;

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (form.site.value) return; // anti-bot

    const ids = ["nomJeu", "discord", "faction", "experience", "projet", "mes1", "mes2", "motivation"];
    const missing = ids.filter(id => !val(id));
    const dispos = [...form.querySelectorAll("input[name=dispo]:checked")].map(i => i.value);
    if (missing.length || !dispos.length) {
      show("err", "Complète tous les champs et choisis au moins une disponibilité.");
      return;
    }
    if (WEBHOOK_URL.startsWith("COLLE")) {
      show("err", "Le webhook n'est pas configuré dans le fichier.");
      return;
    }
    const last = Number(localStorage.getItem("candid_last") || 0);
    if (Date.now() - last < 60000) { show("err", "Patiente une minute avant de renvoyer."); return; }

    const faction = val("faction");
    const payload = {
      username: "Candidatures",
      embeds: [{
        title: "Nouvelle candidature : " + faction,
        color: COLORS[faction] || 0x4fb3a5,
        fields: [
          { name: "Nom en jeu", value: cut(val("nomJeu"), 1024), inline: true },
          { name: "Pseudo Discord", value: cut(val("discord"), 1024), inline: true },
          { name: "Faction visée", value: faction, inline: true },
          { name: "Expérience", value: cut(val("experience"), 1024) },
          { name: "Projet de faction", value: cut(val("projet"), 1024) },
          { name: "Mise en scène 1", value: cut(val("mes1"), 1024) },
          { name: "Mise en scène 2", value: cut(val("mes2"), 1024) },
          { name: "Disponibilités", value: dispos.join("\n") },
          { name: "Motivation", value: cut(val("motivation"), 1024) }
        ],
        timestamp: new Date().toISOString()
      }]
    };

    btn.disabled = true; btn.textContent = "Envoi en cours…";
    try {
      const r = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (!r.ok) throw new Error(r.status);
      localStorage.setItem("candid_last", Date.now());
      form.reset();
      document.querySelectorAll(".count").forEach((c, i) => c.textContent = "0 / 1000");
      show("ok", "Candidature envoyée. Le staff te répondra sur Discord.");
    } catch (err) {
      show("err", "Envoi impossible. Réessaie, ou préviens le staff si le problème continue.");
    } finally {
      btn.disabled = false; btn.textContent = "Envoyer ma candidature";
    }
  });
</script>
</body>
</html>
